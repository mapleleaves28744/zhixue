# 智学工坊 — 轻量应用服务器 / 生产环境 Docker Compose
# 用法: 在服务器上 cp .env.example .env 并修改后执行
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhixue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhixue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhixue_password}
      POSTGRES_DB: ${POSTGRES_DB:-zhixue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixue} -d ${POSTGRES_DB:-zhixue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zhixue-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloudrun
    container_name: zhixue-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://zhixue:zhixue_password@postgres:5432/zhixue}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: production
      DEBUG: "false"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENDPOINT: https://hf-mirror.com
      USE_TF: "0"
      TRANSFORMERS_NO_TF: "1"
    volumes:
      - ./storage:/app/storage
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloudrun
    container_name: zhixue-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://zhixue:zhixue_password@postgres:5432/zhixue}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: production
      DEBUG: "false"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENDPOINT: https://hf-mirror.com
      USE_TF: "0"
      TRANSFORMERS_NO_TF: "1"
    volumes:
      - ./storage:/app/storage
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: arq app.workers.agent_worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cloudrun
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api/v1}
    container_name: zhixue-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: zhixue-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  model_cache:
