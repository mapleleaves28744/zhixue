# 智学工坊 — 轻量应用服务器 / 生产环境 Docker Compose
# 用法: 在服务器上 cp .env.example .env 并修改后执行
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhixue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhixue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhixue_password}
      POSTGRES_DB: ${POSTGRES_DB:-zhixue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixue} -d ${POSTGRES_DB:-zhixue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zhixue-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloudrun
    container_name: zhixue-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD:-zhixue_password}@postgres:5432/${POSTGRES_DB:-zhixue}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      OPENMAIC_ENABLED: "true"
      OPENMAIC_BASE_URL: http://openmaic:3000
      OPENMAIC_PUBLIC_BASE_URL: ${OPENMAIC_PUBLIC_BASE_URL:-http://localhost:3001}
      OPENMAIC_INTERNAL_TOKEN: ${OPENMAIC_INTERNAL_TOKEN}
      OPENMAIC_SIGNING_SECRET: ${OPENMAIC_SIGNING_SECRET}
      APP_ENV: production
      DEBUG: "false"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENDPOINT: https://hf-mirror.com
      USE_TF: "0"
      TRANSFORMERS_NO_TF: "1"
    volumes:
      - ./storage:/app/storage
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openmaic:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloudrun
    container_name: zhixue-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zhixue}:${POSTGRES_PASSWORD:-zhixue_password}@postgres:5432/${POSTGRES_DB:-zhixue}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      OPENMAIC_ENABLED: "true"
      OPENMAIC_BASE_URL: http://openmaic:3000
      OPENMAIC_PUBLIC_BASE_URL: ${OPENMAIC_PUBLIC_BASE_URL:-http://localhost:3001}
      OPENMAIC_INTERNAL_TOKEN: ${OPENMAIC_INTERNAL_TOKEN}
      OPENMAIC_SIGNING_SECRET: ${OPENMAIC_SIGNING_SECRET}
      APP_ENV: production
      DEBUG: "false"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENDPOINT: https://hf-mirror.com
      USE_TF: "0"
      TRANSFORMERS_NO_TF: "1"
    volumes:
      - ./storage:/app/storage
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      openmaic:
        condition: service_healthy
    command: arq app.workers.agent_worker.WorkerSettings

  openmaic:
    build:
      context: ./third_party/openmaic
      dockerfile: Dockerfile
    container_name: zhixue-openmaic
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      OPENMAIC_INTERNAL_TOKEN: ${OPENMAIC_INTERNAL_TOKEN}
      OPENMAIC_SIGNING_SECRET: ${OPENMAIC_SIGNING_SECRET}
      OPENMAIC_CLASSROOM_SCENE_CONCURRENCY: ${OPENMAIC_CLASSROOM_SCENE_CONCURRENCY:-2}
      OPENMAIC_CLASSROOM_TTS_CONCURRENCY: ${OPENMAIC_CLASSROOM_TTS_CONCURRENCY:-2}
    ports:
      - "${OPENMAIC_PORT:-3001}:3000"
    volumes:
      - ./third_party/openmaic/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cloudrun
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api/v1}
    container_name: zhixue-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: zhixue-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  model_cache:
