                        - paragraph [ref=f4e282]: "# BFS 广度优先搜索教学插图 ## 📊 BFS算法概述 **广度优先搜索（BFS）** 是一种用于遍历或搜索树或图的算法。它从根节点开始，逐层访问所有相邻节点，使用**队列（Queue）**数据结构来管理待访问节点。 ## 🎯 BFS核心特点 1. **层次遍历**：按距离起点的远近顺序访问节点 2. **队列管理**：先进先出（FIFO）原则 3. **最短路径**：在无权图中能找到最短路径 4. **空间复杂度**：O(V)，其中V是顶点数 ## 📈 BFS算法步骤 ### 步骤1：初始化 - 创建空队列 `Q` - 将起始节点标记为已访问，加入队列 - 初始化距离数组 ### 步骤2：循环处理 ```python def bfs(graph, start): queue = deque([start]) visited = {start} distance = {start: 0} while queue: node = queue.popleft() # 从队列前端取出节点 for neighbor in graph[node]: if neighbor not in visited: visited.add(neighbor) distance[neighbor] = distance[node] + 1 queue.append(neighbor) # 加入队列后端 return distance ``` ## 🖼️ BFS教学插图 ### 示例图结构 ``` A / \\ B C / \\ \\ D E F ``` ### BFS遍历过程（从节点A开始） #### 阶段1：初始化 - **队列状态**: `[A]` - **已访问**: `{A}` - **距离**: `{A: 0}` #### 阶段2：处理A - **操作**: 从队列取出A，访问其邻居B、C - **队列变化**: `[A]` → `[]` → `[B, C]` - **已访问**: `{A, B, C}` - **距离**: `{A: 0, B: 1, C: 1}` #### 阶段3：处理B - **操作**: 从队列取出B，访问其邻居D、E - **队列变化**: `[B, C]` → `[C]` → `[C, D, E]` - **已访问**: `{A, B, C, D, E}` - **距离**: `{A: 0, B: 1, C: 1, D: 2, E: 2}` #### 阶段4：处理C - **操作**: 从队列取出C，访问其邻居F - **队列变化**: `[C, D, E]` → `[D, E]` → `[D, E, F]` - **已访问**: `{A, B, C, D, E, F}` - **距离**: `{A: 0, B: 1, C: 1, D: 2, E: 2, F: 2}` #### 阶段5：处理D、E、F - **队列变化**: `[D, E, F]` → `[E, F]` → `[F]` → `[]` - **最终距离**: `{A: 0, B: 1, C: 1, D: 2, E: 2, F: 2}` ## 📊 可视化表示 ### 队列状态变化图 ``` 初始状态: [A] 处理A后: [B, C] 处理B后: [C, D, E] 处理C后: [D, E, F] 处理D后: [E, F] 处理E后: [F] 处理F后: [] ``` ### 搜索层次图 ``` 层次0: A 层次1: B, C 层次2: D, E, F ``` ## 🔍 关键要点 1. **队列操作**：`popleft()`（出队）和`append()`（入队） 2. **访问标记**：避免重复访问节点 3. **距离记录**：记录从起点到每个节点的最短距离 4. **层次遍历**：按层次顺序访问节点 ## 💡 应用场景 1. **最短路径问题**：无权图中的最短路径 2. **层序遍历**：二叉树的层序遍历 3. **网络爬虫**：网页爬取策略 4. **社交网络分析**：查找一度、二度好友 ## 📝 总结 BFS使用队列实现层次遍历，确保按距离起点的远近顺序访问节点。这种特性使其特别适合解决最短路径问题和层次结构分析。通过清晰的队列状态变化，可以直观理解BFS的工作原理。"
