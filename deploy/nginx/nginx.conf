upstream zhixue_frontend {
    server frontend:3000;
}

upstream zhixue_backend {
    server backend:8000;
}

upstream zhixue_openmaic {
    server openmaic:3000;
}

# 沉浸课堂页加载的 /_next 静态资源需走 OpenMAIC，其余走智学前端
map $http_referer $openmaic_static_host {
    default frontend:3000;
    "~*/classroom/" openmaic:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        proxy_pass http://zhixue_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # OpenMAIC 沉浸课堂（公网 80 端口，无需单独开放 3001）
    location ^~ /classroom/ {
        set $openmaic_upstream openmaic:3000;
        proxy_pass http://$openmaic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /api/classroom-media/ {
        set $openmaic_upstream openmaic:3000;
        proxy_pass http://$openmaic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /api/classroom {
        set $openmaic_upstream openmaic:3000;
        proxy_pass http://$openmaic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /avatars/ {
        set $openmaic_upstream openmaic:3000;
        proxy_pass http://$openmaic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/classrooms/ {
        set $openmaic_upstream openmaic:3000;
        proxy_pass http://$openmaic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://$openmaic_static_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://zhixue_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://zhixue_backend;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://zhixue_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://zhixue_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
