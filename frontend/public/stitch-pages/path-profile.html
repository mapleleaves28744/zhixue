<script>
    // Subtle interactivity
    document.querySelectorAll('.glass-card').forEach(card => {
        card.addEventListener('mouseenter', () => {
            card.style.transform = 'translateY(-2px)';
            card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'translateY(0)';
        });

</script>
<script src="/stitch-pages/zhixue-ui.js"></script>
<script src="/stitch-pages/zhixue-static-api.js"></script>
<script>
(() => {
  const api = window.ZhixueStatic;

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[char]));
  }

  function profileEmptyStateHtml(title, description, scene = "empty", compact = false) {
    return window.ZhixueUI?.emptyState?.({
      mascot: "lulu",
      scene,
      title,
      description,
      compact,
    })?.outerHTML || `
      <div class="p-5 bg-surface-container-low rounded-xl border border-outline-variant/20 text-center">
        <p class="font-bold text-body-md">${escapeHtml(title)}</p>
        <p class="text-label-sm text-on-surface-variant mt-1">${escapeHtml(description)}</p>
      </div>`;
  }

  function findSectionByTitle(title) {
    return [...document.querySelectorAll("section")].find((section) => section.innerText.includes(title));
  }

  function extractNamedItems(list, nameKeys = ["knowledge_name", "name", "pattern"]) {
    if (!Array.isArray(list)) return [];
    return list.map((item) => {
      if (typeof item === "string") return item.trim();
      if (item && typeof item === "object") {
        for (const key of nameKeys) {
          const value = String(item[key] || "").trim();
          if (value) return value;
        }
      }
      return "";
    }).filter(Boolean);
  }

  function resolveMasteryPercent(courseProfile, analyticsMastery) {
    const snap = courseProfile?.mastery_snapshot;
    if (snap && typeof snap === "object") {
      const overallPercent = Number(snap._overall_percent);
      if (Number.isFinite(overallPercent) && overallPercent > 0) {
        return Math.round(overallPercent);
      }
      const overall = Number(snap._overall);
      if (Number.isFinite(overall) && overall > 0) {
        return Math.round(overall <= 1 ? overall * 100 : overall);
      }
      const items = Array.isArray(snap._items) ? snap._items : [];
      if (items.length) {
        const avg = items.reduce((sum, item) => sum + Number(item.mastery_score || 0), 0) / items.length;
        if (avg > 0) return Math.round(avg * 100);
      }
      const scores = Object.entries(snap)
        .filter(([key]) => !key.startsWith("_"))
        .map(([, value]) => Number(value))
        .filter((value) => Number.isFinite(value) && value >= 0 && value <= 1);
      if (scores.length) {
        return Math.round((scores.reduce((sum, value) => sum + value, 0) / scores.length) * 100);
      }
    }
    if (analyticsMastery != null && Number.isFinite(Number(analyticsMastery))) {
      return Math.round(Number(analyticsMastery));
    }
    return null;
  }

  function renderCoursePortraitBlock(courseProfile) {
    if (!courseProfile) {
      return `<p class="text-label-sm text-on-surface-variant mt-2">暂无课程画像证据，完成一次有效问答或练习后自动生成。</p>`;
    }
    const weakPoints = extractNamedItems(courseProfile.weak_points);
    const errorPatterns = extractNamedItems(courseProfile.error_patterns, ["pattern", "name", "knowledge_name"]);
    const goal = String(courseProfile.learning_goal || "").trim();
    const summary = String(courseProfile.profile_summary || "").trim();
    const parts = [];
    if (goal) {
      parts.push(`<p class="text-label-sm text-on-surface-variant mt-2"><span class="font-bold text-on-surface">课程目标：</span>${escapeHtml(goal)}</p>`);
    }
    if (weakPoints.length) {
      parts.push(`
        <div class="mt-3">
          <p class="text-[11px] font-bold text-tertiary mb-1.5">薄弱点</p>
          <div class="flex flex-wrap gap-1.5">${weakPoints.slice(0, 6).map((name) => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-tertiary/10 text-tertiary border border-tertiary/15">${escapeHtml(name)}</span>`).join("")}</div>
        </div>`);
    }
    if (errorPatterns.length) {
      parts.push(`
        <div class="mt-3">
          <p class="text-[11px] font-bold text-secondary mb-1.5">常见错误</p>
          <div class="flex flex-wrap gap-1.5">${errorPatterns.slice(0, 4).map((name) => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-secondary-fixed/60 text-on-secondary-fixed-variant">${escapeHtml(name)}</span>`).join("")}</div>
        </div>`);
    }
    if (!parts.length && summary && !summary.includes("knowledge_name")) {
      parts.push(`<p class="text-label-sm text-on-surface-variant mt-2">${escapeHtml(summary)}</p>`);
    }
    if (!parts.length) {
      parts.push(`<p class="text-label-sm text-on-surface-variant mt-2">当前课程画像正在积累真实学习证据。</p>`);
    }
    return parts.join("");
  }

  function renderProfile(profile, preferences, courseProfile, analyticsMastery) {
    const section = findSectionByTitle("学生画像摘要");
    if (!section) return;
    const score = resolveMasteryPercent(courseProfile, analyticsMastery);
    const offset = score == null ? 264 : Math.max(0, 264 - (264 * score) / 100).toFixed(1);
    const prefTags = [
      ...(preferences || []).map((item) => item.explanation_style || item.answer_length).filter(Boolean),
      profile.learning_goal,
      profile.major,
    ].filter(Boolean).slice(0, 4);
    const dialogueProfile = profile.strategy_summary?.dialogue_profile || {};
    const dialogueDimensions = dialogueProfile.dimensions || {};
    const dimensionLabels = {
      major: "专业",
      grade: "年级",
      learning_goal: "目标",
      answer_length: "回答长度",
      explanation_style: "解释风格",
      resource_preferences: "资源偏好",
      weak_points: "薄弱点",
      error_patterns: "错误模式",
    };
    const evidenceItems = Object.entries(dialogueDimensions).map(([key, dimension]) => {
      const items = Array.isArray(dimension.items) ? dimension.items : [];
      const value = dimension.value || items.map((item) => item.knowledge_name || item.pattern || item.name).filter(Boolean).join("、");
      const evidence = Array.isArray(dimension.evidence) ? dimension.evidence[dimension.evidence.length - 1] : null;
      return {
        label: dimensionLabels[key] || key,
        value,
        confidence: Math.round(Number(dimension.confidence || 0.8) * 100),
        quote: evidence?.quote || "",
      };
    }).filter((item) => item.value).slice(0, 3);

    section.innerHTML = `
      <h3 class="font-headline-md text-headline-md mb-8 flex items-center">
        <span class="material-symbols-outlined mr-2 text-secondary">face_6</span>学生画像摘要
      </h3>
      <div class="space-y-4">
        <div class="relative aspect-square w-full max-w-[220px] mx-auto flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
            <circle class="text-surface-container-high" cx="50" cy="50" fill="transparent" r="42" stroke="currentColor" stroke-width="8"></circle>
            <circle class="text-primary" cx="50" cy="50" fill="transparent" r="42" stroke="currentColor" stroke-dasharray="264" stroke-dashoffset="${offset}" stroke-linecap="round" stroke-width="8"></circle>
          </svg>
          <div class="absolute text-center">
            <p class="text-4xl font-extrabold text-on-surface">${score == null ? "--" : `${score}%`}</p>
            <p class="text-label-sm text-on-surface-variant uppercase tracking-widest mt-1">知识掌控度</p>
          </div>
          <div class="absolute inset-2 border border-outline-variant/10 rounded-full"></div>
          <div class="absolute inset-6 border border-outline-variant/20 rounded-full"></div>
        </div>
        <div class="mt-8 space-y-4">
          <p class="text-label-md font-bold flex items-center text-on-surface">
            <span class="material-symbols-outlined text-lg mr-2 text-outline">psychology_alt</span>学习偏好
          </p>
          <div class="flex flex-wrap gap-2">
            ${(prefTags.length ? prefTags : ["结构化讲解", "循序渐进", "数据结构演示"]).map((tag, index) => `
              <span class="text-label-sm px-3 py-1.5 rounded-full ${index % 3 === 0 ? "bg-secondary-fixed text-on-secondary-fixed-variant" : index % 3 === 1 ? "bg-tertiary-fixed text-on-tertiary-fixed-variant" : "bg-primary-fixed text-on-primary-fixed-variant"}">${escapeHtml(tag)}</span>
            `).join("")}
          </div>
          <p class="text-label-md text-on-surface-variant leading-relaxed">${escapeHtml(profile.profile_summary || "画像已由后端创建，后续会根据答疑、资料、练习和记忆持续更新。")}</p>
          <div class="rounded-2xl bg-tertiary/5 border border-tertiary/15 p-4">
            <p class="text-label-sm font-bold text-tertiary">当前课程画像</p>
            ${renderCoursePortraitBlock(courseProfile)}
          </div>
          ${evidenceItems.length ? `
            <div class="rounded-2xl bg-primary/5 border border-primary/15 p-4 space-y-3">
              <div class="flex items-center justify-between">
                <p class="text-label-sm font-bold text-primary flex items-center">
                  <span class="material-symbols-outlined text-base mr-1">verified</span>对话证据
                </p>
                <span class="text-[11px] font-bold text-outline">来源 ${dialogueProfile.source_count || evidenceItems.length} 条</span>
              </div>
              ${evidenceItems.map((item) => `
                <div class="min-w-0">
                  <div class="flex items-center justify-between gap-3">
                    <p class="text-xs font-bold text-on-surface truncate">${escapeHtml(item.label)}：${escapeHtml(item.value)}</p>
                    <span class="text-[11px] font-bold text-primary shrink-0">${item.confidence}%</span>
                  </div>
                  <p class="text-[11px] text-on-surface-variant leading-5 line-clamp-2">${window.ZhixueUI?.renderMarkdown ? window.ZhixueUI.renderMarkdown(item.quote) : escapeHtml(item.quote)}</p>
                </div>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="pt-6 mt-6 border-t border-outline-variant/30 flex justify-between items-end">
          <div>
            <p class="text-label-sm text-on-surface-variant">画像版本</p>
            <p class="text-headline-sm font-bold text-primary">V${profile.version_no || 1}</p>
          </div>
          <button id="profile-rebuild-button" class="text-label-md font-bold text-primary flex items-center hover:translate-x-1 transition-transform">
            重建画像 <span class="material-symbols-outlined text-base ml-1">auto_fix_high</span>
          </button>
        </div>
      </div>`;
    section.querySelector("#profile-rebuild-button")?.addEventListener("click", rebuildProfile);
  }

  function renderMemories(memories, memoryHealth, memoryStatus = "active") {
    const section = findSectionByTitle("长期记忆");
    if (!section) return;
    section.classList.add("path-profile-compact");
    section.innerHTML = `
      <div class="flex justify-between items-center mb-3 gap-2">
        <h3 class="font-headline-sm text-headline-sm flex items-center min-w-0">
          <span class="material-symbols-outlined mr-2 text-tertiary text-lg">memory</span>长期记忆
        </h3>
        <div class="flex items-center gap-1.5 shrink-0">
          <select id="memory-status" class="text-[11px] px-2 py-1 rounded-full bg-surface-container-high text-on-surface-variant border-none">
            <option value="active" ${memoryStatus === "active" ? "selected" : ""}>活跃</option>
            <option value="archived" ${memoryStatus === "archived" ? "selected" : ""}>归档</option>
            <option value="all" ${memoryStatus === "all" ? "selected" : ""}>全部</option>
          </select>
          <span class="text-[11px] px-2 py-1 rounded-full bg-surface-container-high text-on-surface-variant">${memoryHealth?.active_count || 0}/${memoryHealth?.capacity || 0} · ${memories.length} 条</span>
        </div>
      </div>
      <div class="space-y-2 pr-1 custom-scrollbar" style="max-height:220px;overflow-y:auto;overscroll-behavior:contain;">
        ${memories.length ? memories.map((memory) => `
          <div class="group p-3 bg-surface-container-low rounded-xl hover:bg-white hover:shadow-sm transition-all flex items-center justify-between border border-transparent hover:border-outline-variant/30" data-memory-id="${memory.id}">
            <div class="flex items-center space-x-3 min-w-0">
              <div class="w-8 h-8 rounded-lg bg-tertiary-fixed text-on-tertiary-fixed-variant flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-base">menu_book</span>
              </div>
              <div class="min-w-0">
                <p class="font-bold text-sm truncate">${escapeHtml(memory.content)}</p>
                <p class="text-[11px] text-on-surface-variant truncate">${escapeHtml(memory.memory_type)} · ${Math.round(Number(memory.confidence || 0.8) * 100)}% · ${api.formatDate(memory.updated_at)}</p>
              </div>
            </div>
            <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
              <button class="p-1.5 text-primary hover:bg-primary-fixed rounded-lg" data-action="evidence" title="查看证据"><span class="material-symbols-outlined text-sm">link</span></button>
              ${memory.status === "archived" ? `<button class="p-1.5 text-primary hover:bg-primary-fixed rounded-lg" data-action="restore" title="恢复"><span class="material-symbols-outlined text-sm">restore</span></button>` : `<button class="p-1.5 text-error hover:bg-error-container rounded-lg" data-action="delete" title="归档"><span class="material-symbols-outlined text-sm">archive</span></button>`}
            </div>
          </div>
        `).join("") : `
          ${profileEmptyStateHtml("暂无长期记忆", "点击下方按钮，让 Memory Agent 基于学习行为生成第一批记忆。", "reminder", true)}`}
      </div>
      <button id="memory-reflect-button" class="w-full mt-3 py-2 rounded-xl border border-dashed border-outline-variant/50 text-on-surface-variant text-[11px] font-bold hover:border-primary hover:text-primary hover:bg-primary/5 transition-all">
        触发 Memory Agent 反思
      </button>`;

    section.querySelector("#memory-reflect-button")?.addEventListener("click", reflectMemory);
    section.querySelector("#memory-status")?.addEventListener("change", (event) => loadProfileSpace(event.target.value));
    section.querySelectorAll("[data-action='evidence']").forEach((button) => {
      button.addEventListener("click", (event) => {
        const id = event.currentTarget.closest("[data-memory-id]")?.dataset.memoryId;
        const memory = memories.find((item) => item.id === id);
        api.toast(memory && memory.evidence && memory.evidence.length ? JSON.stringify(memory.evidence).slice(0, 180) : "暂无证据链，后续行为会继续补充。", "info");
      });
    });
    section.querySelectorAll("[data-action='delete']").forEach((button) => {
      button.addEventListener("click", async (event) => {
        const id = event.currentTarget.closest("[data-memory-id]")?.dataset.memoryId;
        if (!id || !confirm("确认归档这条长期记忆？")) return;
        await api.request(`/student/memory/${id}`, { method: "DELETE" });
        api.toast("记忆已归档", "success");
        await loadProfileSpace();
      });
    });
    section.querySelectorAll("[data-action='restore']").forEach((button) => {
      button.addEventListener("click", async (event) => {
        const id = event.currentTarget.closest("[data-memory-id]")?.dataset.memoryId;
        if (!id) return;
        await api.restoreMemory(id);
        api.toast("记忆已恢复，容量规则会自动整理活跃集合", "success");
        await loadProfileSpace("archived");
      });
    });
  }

  const RISK_STYLES = { low: "bg-green-100 text-green-700", medium: "bg-primary-fixed text-on-primary-fixed-variant", high: "bg-error text-white" };
  const RISK_LABELS = { low: "低风险", medium: "中风险", high: "高风险" };
  const STATUS_LABELS = { draft: "待确认", active: "已生效", superseded: "已替代", rolled_back: "已回滚", rejected: "已拒绝" };
  const TYPE_LABELS = { difficulty: "难度调节", knowledge_skip: "知识跳跃", interaction: "交互偏好", recommendation: "推荐策略", prompt_style: "提示词风格", resource_type: "资源类型" };

  function formatStrategyValue(value) {
    if (!value || typeof value !== "object" || Object.keys(value).length === 0) return "-";
    const entries = Object.entries(value);
    if (entries.length === 1) return String(entries[0][1]);
    return entries.map(([k, v]) => k + ": " + v).join(", ");
  }

  function renderStrategies(data) {
    const section = findSectionByTitle("自进化策略");
    if (!section) return;
    section.classList.add("path-profile-compact");
    const strategies = data.items || [];
    const draftStrategies = strategies.filter((s) => s.status === "draft");
    const displayStrategies = draftStrategies.length > 0 ? draftStrategies : strategies.filter((s) => s.status === "active");

    section.innerHTML = `
      <div class="flex flex-col gap-2 mb-3">
        <div class="flex items-center justify-between gap-2">
          <h3 class="font-headline-sm text-headline-sm flex items-center min-w-0">
            <span class="material-symbols-outlined mr-2 text-primary text-lg" style="font-variation-settings: 'FILL' 1;">bolt</span>自进化策略
          </h3>
          <div class="flex flex-wrap justify-end gap-1.5 shrink-0">
            <a href="/evolution" target="_parent" class="px-2.5 py-1 text-[11px] font-bold glass-card rounded-lg border border-primary/20 text-primary">仪表盘</a>
            <button id="evolution-analyze-button" class="px-2.5 py-1 text-[11px] font-bold bg-primary text-white rounded-lg">触发分析</button>
            <button id="evolution-refresh-button" class="px-2.5 py-1 text-[11px] font-bold glass-card rounded-lg border border-outline-variant/30">刷新</button>
          </div>
        </div>
      </div>
      ${displayStrategies.length === 0 ? `
        ${profileEmptyStateHtml("暂无策略建议", "点击「触发分析」，Evolution Agent 会基于学习数据生成策略。中/高风险需确认后生效。", "thinking", true)}
      ` : `
        <div class="space-y-2 pr-1 custom-scrollbar" style="max-height:220px;overflow-y:auto;overscroll-behavior:contain;">
          ${displayStrategies.map((s) => `
            <div class="rounded-xl border ${s.risk_level === "high" ? "border-error/30 bg-error-container/15" : "border-outline-variant/20 bg-surface-container-low/60"} p-3">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="text-sm font-bold truncate">${escapeHtml(TYPE_LABELS[s.strategy_type] || s.strategy_type)}</p>
                  <p class="text-[11px] text-on-surface-variant mt-1 line-clamp-2">${escapeHtml(formatStrategyValue(s.materialized_changes?.values || s.after_value))}</p>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${RISK_STYLES[s.risk_level] || RISK_STYLES.medium}">${escapeHtml(RISK_LABELS[s.risk_level] || s.risk_level)}</span>
              </div>
              <div class="flex items-center justify-between mt-2 gap-2">
                <span class="text-[10px] text-on-surface-variant">${escapeHtml(STATUS_LABELS[s.status] || s.status)}</span>
                <div class="space-x-2 shrink-0">
                  ${s.status === "draft" ? `<button class="text-primary text-[11px] font-bold hover:underline" data-action="apply" data-id="${s.id}">确认</button><button class="text-error text-[11px] font-bold hover:underline" data-action="reject" data-id="${s.id}">拒绝</button>` : ""}
                  ${s.status === "active" && s.previous_strategy_id ? `<button class="text-on-surface-variant text-[11px] font-bold hover:underline" data-action="rollback" data-id="${s.id}">回滚</button>` : ""}
                </div>
              </div>
            </div>
          `).join("")}
        </div>
        ${draftStrategies.length > 0 ? `<p class="text-[10px] text-on-surface-variant mt-2">${draftStrategies.length} 条待确认 · 低风险策略会自动生效</p>` : ""}
      `}`;

    section.querySelector("#evolution-analyze-button")?.addEventListener("click", analyzeStrategies);
    section.querySelector("#evolution-refresh-button")?.addEventListener("click", loadProfileSpace);
    section.querySelectorAll("[data-action='apply']").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        if (!id) return;
        btn.textContent = "处理中...";
        btn.disabled = true;
        try {
          await api.request("/evolution/strategies/apply", { method: "POST", body: { strategy_id: id } });
          api.toast("策略已生效", "success");
          await loadProfileSpace();
        } catch (error) {
          api.toast(error.message || "应用失败", "error");
          btn.textContent = "确认";
          btn.disabled = false;
        }
      });
    });
    section.querySelectorAll("[data-action='rollback']").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        if (!id || !confirm("确认回滚到上一版本？")) return;
        btn.textContent = "处理中...";
        btn.disabled = true;
        try {
          await api.request(`/evolution/strategies/${id}/rollback`, { method: "POST" });
          api.toast("已回滚到上一版本", "success");
          await loadProfileSpace();
        } catch (error) {
          api.toast(error.message || "回滚失败", "error");
          btn.textContent = "回滚";
          btn.disabled = false;
        }
      });
    });
    section.querySelectorAll("[data-action='reject']").forEach((btn) => {
      btn.addEventListener("click", async (event) => {
        event.stopPropagation();
        const id = btn.dataset.id;
        if (!id || !confirm("确认拒绝这条策略草案？")) return;
        btn.textContent = "处理中...";
        btn.disabled = true;
        try {
          await api.request(`/evolution/strategies/${id}/reject`, { method: "POST" });
          api.toast("策略草案已拒绝", "success");
          await loadProfileSpace();
        } catch (error) {
          api.toast(error.message || "拒绝失败", "error");
          btn.textContent = "拒绝";
          btn.disabled = false;
        }
      });
    });
  }

  function renderLearningPaths(data) {
    const section = findSectionByTitle("推荐学习路径");
    if (!section) return;
    section.classList.add("self-start", "w-full");
    const paths = data.items || [];
    const path = paths.find((item) => item.status === "active") || paths[0];
    const items = path && path.items ? [...path.items].sort((a, b) => a.order_index - b.order_index) : [];
    const completed = items.filter((item) => item.status === "completed").length;
    const progress = path ? Math.round(Number(path.progress || 0)) : 0;

    section.innerHTML = `
      <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-6">
        <h3 class="font-headline-md text-headline-md flex items-center">
          <span class="material-symbols-outlined mr-2 text-primary">route</span>推荐学习路径
        </h3>
        <div class="flex items-center gap-2">
          ${path ? `<span class="bg-primary/10 text-primary px-4 py-1 rounded-full text-label-sm uppercase tracking-wider">${progress}% 已完成</span>` : ""}
          <button id="learning-path-generate-button" class="px-4 py-1.5 text-label-sm font-bold bg-primary text-white rounded-lg hover:shadow-lg shadow-primary/20 transition-all">生成路径</button>
        </div>
      </div>
      ${!path ? `
        ${profileEmptyStateHtml("暂无学习路径", "点击生成路径，Planner Agent 会基于课程知识点、画像薄弱点和 Wiki 线索生成第一条可执行路径。", "searching")}
      ` : `
        <div class="mb-8 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
          <div>
            <p class="text-label-sm text-on-surface-variant mb-1">当前目标</p>
            <h4 class="font-headline-sm text-on-surface">${escapeHtml(path.title)}</h4>
          </div>
          <p class="text-label-md text-on-surface-variant">${completed}/${items.length} 个节点完成</p>
        </div>
        <div class="relative flex items-center justify-between pb-6 overflow-x-auto custom-scrollbar">
          <div class="absolute top-5 left-0 w-full h-[2px] bg-outline-variant/40"></div>
          ${items.map((item, index) => {
            const isDone = item.status === "completed";
            const isDoing = item.status === "doing";
            const icon = isDone ? "check" : isDoing ? "pending" : "flag";
            const circleClass = isDone
              ? "bg-primary text-white shadow-lg shadow-primary/20"
              : isDoing
                ? "bg-white border-2 border-primary text-primary"
                : "bg-surface-container-high border border-outline-variant text-outline";
            return `
              <div class="relative z-10 flex flex-col items-center min-w-[200px] ${item.status === "pending" ? "opacity-70" : ""}" data-path-item-id="${item.id}">
                <button class="w-11 h-11 rounded-full ${circleClass} flex items-center justify-center mb-4 transition-transform hover:scale-105" data-action="toggle-path-item" title="标记完成">
                  <span class="material-symbols-outlined">${icon}</span>
                </button>
                <div class="text-center px-4">
                  <p class="font-bold text-body-md ${isDoing ? "text-primary" : ""}">${escapeHtml(item.title)}</p>
                  <p class="text-label-sm text-on-surface-variant mb-2">${escapeHtml(item.item_type)} · ${item.estimated_minutes || 30} 分钟</p>
                  <span class="text-[10px] ${isDone ? "bg-primary/10 text-primary" : "bg-surface-container-high text-on-surface-variant"} px-2 py-0.5 rounded-full font-bold">第 ${index + 1} 步</span>
                </div>
              </div>`;
          }).join("")}
        </div>
        <div class="mt-6 p-4 rounded-xl bg-primary-fixed/30 border border-primary-container/20">
          <div class="flex items-start space-x-3">
            <span class="material-symbols-outlined text-primary mt-1">lightbulb</span>
            <div>
              <p class="font-bold text-on-primary-container mb-1">推荐理由</p>
              <p class="text-label-md text-on-surface-variant leading-relaxed">${escapeHtml(path.reason || "基于课程知识顺序、学生画像和近期薄弱点生成。")}</p>
            </div>
          </div>
        </div>
      `}
      <div class="mt-6 flex items-center justify-between text-label-sm text-on-surface-variant">
        <div class="flex items-center"><span class="material-symbols-outlined text-base mr-1">info</span>路径节点可标记完成，进度会写回后端。</div>
        <p>来自 /api/v1/learning-paths</p>
      </div>`;

    section.querySelector("#learning-path-generate-button")?.addEventListener("click", generateLearningPath);
    section.querySelectorAll("[data-action='toggle-path-item']").forEach((button) => {
      button.addEventListener("click", async (event) => {
        const container = event.currentTarget.closest("[data-path-item-id]");
        const itemId = container && container.dataset.pathItemId;
        if (!itemId) return;
        try {
          await api.request(`/learning-paths/items/${itemId}`, { method: "PATCH", body: { status: "completed" } });
          api.toast("路径节点已完成", "success");
          await loadProfileSpace();
        } catch (error) {
          api.toast(error.message || "更新路径节点失败", "error");
        }
      });
    });
  }

  async function rebuildProfile() {
    const button = document.getElementById("profile-rebuild-button");
    try {
      if (button) {
        button.textContent = "重建中...";
        button.disabled = true;
      }
      await api.request("/student/profile/rebuild", { method: "POST" });
      api.toast("画像已重建", "success");
      await loadProfileSpace();
    } catch (error) {
      api.toast(error.message || "画像重建失败", "error");
    }
  }

  async function reflectMemory() {
    const button = document.getElementById("memory-reflect-button");
    try {
      if (button) {
        button.textContent = "Memory Agent 反思中...";
        button.disabled = true;
      }
      const courseId = await api.resolveCourseId().catch(() => null);
      await api.request(`/student/memory/reflect${courseId ? `?course_id=${courseId}` : ""}`, { method: "POST" });
      api.toast("长期记忆已更新", "success");
      await loadProfileSpace();
    } catch (error) {
      api.toast(error.message || "记忆反思失败", "error");
    }
  }

  async function analyzeStrategies() {
    const button = document.getElementById("evolution-analyze-button");
    try {
      if (button) {
        button.textContent = "分析中…";
        button.disabled = true;
      }
      api.toast("策略分析进行中，通常需要 30–60 秒，请稍候", "info");
      const courseId = await api.resolveCourseId().catch(() => null);
      if (!courseId) {
        api.toast("请先创建或选择课程，再触发策略分析", "error");
        return;
      }
      const result = await api.request("/evolution/analyze", {
        method: "POST",
        body: { course_id: courseId, focus: "学习策略优化" },
      });
      const count = Number(result?.strategies_count || result?.strategies?.length || 0);
      if (count <= 0) {
        api.toast("未生成策略，请先做练习或答疑以积累学习证据", "info");
      } else {
        api.toast(`已生成 ${count} 条策略建议`, "success");
        if (Array.isArray(result?.strategies) && result.strategies.length) {
          renderStrategies({ items: result.strategies });
        }
      }
      await loadProfileSpace();
    } catch (error) {
      api.toast(error.message || "策略分析失败", "error");
    } finally {
      if (button) {
        button.textContent = "触发分析";
        button.disabled = false;
      }
    }
  }

  async function generateLearningPath() {
    const button = document.getElementById("learning-path-generate-button") || document.querySelector(".fixed.bottom-8.right-8 button");
    try {
      if (button) {
        button.textContent = "生成中...";
        button.disabled = true;
      }
      const courseId = await api.resolveCourseId();
      await api.request("/learning-paths/generate", {
        method: "POST",
        body: {
          course_id: courseId,
          goal: "补强数据结构核心薄弱点",
          target_knowledge_ids: [],
          path_type: "weakness_repair",
        },
      });
      api.toast("学习路径已生成", "success");
      await loadProfileSpace();
    } catch (error) {
      api.toast(error.message || "学习路径生成失败", "error");
    }
    if (button) {
      button.innerHTML = button.classList.contains("flex")
        ? '<span class="material-symbols-outlined group-hover:rotate-12 transition-transform">auto_fix_high</span><span class="font-bold tracking-wide">生成路径优化建议</span>'
        : "生成路径";
      button.disabled = false;
    }
  }

  async function loadProfileSpace(memoryStatus = "active") {
    try {
      const courseId = await api.resolveCourseId().catch(() => null);
      const strategiesUrl = courseId
        ? `/evolution/strategies?course_id=${courseId}&page=1&page_size=20`
        : "/evolution/strategies?page=1&page_size=20";
      const [profile, courseProfile, preferences, memories, memoryHealth, strategies, learningPaths, analytics] = await Promise.all([
        api.request("/student/profile"),
        courseId ? api.request(`/student/profile/course/${courseId}`).catch(() => null) : Promise.resolve(null),
        api.request("/student/profile/preferences").catch(() => []),
        api.request(`/student/memory?status=${memoryStatus}${courseId ? `&course_id=${courseId}` : ""}`).catch(() => []),
        api.memoryHealth(courseId).catch(() => ({ active_count: 0, archived_count: 0, capacity: courseId ? 20 : 10 })),
        api.request(strategiesUrl).catch(() => ({ items: [], total: 0 })),
        courseId ? api.request(`/learning-paths?course_id=${courseId}&page=1&page_size=5`).catch(() => ({ items: [], total: 0 })) : Promise.resolve({ items: [], total: 0 }),
        courseId && api.learningAnalyticsSummary
          ? api.learningAnalyticsSummary(courseId, "week").catch(() => null)
          : Promise.resolve(null),
      ]);
      renderLearningPaths(learningPaths);
      renderProfile(profile, preferences, courseProfile, analytics?.mastery);
      renderMemories(memories, memoryHealth, memoryStatus);
      renderStrategies(strategies);
    } catch (error) {
      api.toast(error.message || "个人模型加载失败", "error");
    }
  }

  document.querySelector(".fixed.bottom-8.right-8 button")?.addEventListener("click", generateLearningPath);
  void loadProfileSpace();
})();
</script>
</body></html>
