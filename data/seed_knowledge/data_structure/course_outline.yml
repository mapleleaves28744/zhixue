course:
  title: 数据结构
  style: 中文高校 + Python
  phase: GraphRAG-ready v0
chapters:
  - chapter_id: ch01
    title: 导论
    learning_goals: [理解数据结构与算法关系, 区分逻辑结构和存储结构]
    knowledge_points: [数据结构, 算法, 抽象数据类型ADT, 逻辑结构, 存储结构]
    prerequisites: []
    resource_types: [doc, card, quiz]
    expected_exercises: [概念辨析, ADT 描述]
  - chapter_id: ch02
    title: 复杂度
    learning_goals: [掌握时间复杂度和空间复杂度, 能分析递归复杂度]
    knowledge_points: [时间复杂度, 空间复杂度, 渐进记号, 最好最坏平均情况, 递归复杂度]
    prerequisites: [ch01]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [复杂度计算, 递归式分析]
  - chapter_id: ch03
    title: 线性表
    learning_goals: [理解线性表逻辑模型, 比较顺序表和链式结构]
    knowledge_points: [线性表, 顺序表, 插入删除, 随机访问]
    prerequisites: [ch01, ch02]
    resource_types: [doc, card, code_case]
    expected_exercises: [顺序表操作, 边界条件]
  - chapter_id: ch04
    title: 链表
    learning_goals: [掌握单链表和双向链表, 能处理指针边界]
    knowledge_points: [单链表, 双向链表, 循环链表, 头结点, 指针修改]
    prerequisites: [ch03]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [链表插入删除, 反转链表]
  - chapter_id: ch05
    title: 栈
    learning_goals: [理解后进先出, 能用栈解决表达式和括号问题]
    knowledge_points: [栈, 顺序栈, 链栈, 括号匹配, 表达式求值]
    prerequisites: [ch03]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [入栈出栈, 括号匹配]
  - chapter_id: ch06
    title: 队列
    learning_goals: [理解先进先出, 掌握循环队列判空判满]
    knowledge_points: [队列, 循环队列, 链队列, 双端队列]
    prerequisites: [ch03]
    resource_types: [doc, card, quiz]
    expected_exercises: [循环队列, 队列模拟]
  - chapter_id: ch07
    title: 递归
    learning_goals: [理解递归三要素, 能分析调用栈]
    knowledge_points: [递归, 递归出口, 调用栈, 递归复杂度]
    prerequisites: [ch02, ch05]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [递归跟踪, 汉诺塔]
  - chapter_id: ch08
    title: 树
    learning_goals: [理解树的层次结构, 掌握基本术语]
    knowledge_points: [树, 结点, 度, 深度, 高度, 森林]
    prerequisites: [ch07]
    resource_types: [doc, card, quiz]
    expected_exercises: [树术语, 层次关系]
  - chapter_id: ch09
    title: 二叉树
    learning_goals: [掌握二叉树性质和遍历, 理解堆与哈夫曼树基础]
    knowledge_points: [二叉树, 完全二叉树, 二叉树遍历, 线索二叉树, 哈夫曼树]
    prerequisites: [ch08]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [遍历序列, 二叉树性质]
  - chapter_id: ch10
    title: 堆
    learning_goals: [理解堆序性质, 掌握优先队列和堆排序基础]
    knowledge_points: [堆, 二叉堆, 优先队列, 上滤, 下滤]
    prerequisites: [ch09]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [建堆, 堆调整]
  - chapter_id: ch11
    title: 哈希表
    learning_goals: [理解哈希函数和冲突处理, 掌握装填因子影响]
    knowledge_points: [哈希表, 哈希函数, 链地址法, 开放定址法, 装填因子]
    prerequisites: [ch03, ch02]
    resource_types: [doc, card, quiz]
    expected_exercises: [冲突处理, 平均查找长度]
  - chapter_id: ch12
    title: 图
    learning_goals: [理解图的基本概念和存储结构]
    knowledge_points: [图, 顶点, 边, 邻接矩阵, 邻接表]
    prerequisites: [ch03, ch08]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [图表示, 度计算]
  - chapter_id: ch13
    title: BFS
    learning_goals: [掌握广度优先搜索和队列关系]
    knowledge_points: [BFS, 队列, 层次遍历, 最短无权路径]
    prerequisites: [ch06, ch12]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [BFS 访问序, 无权最短路]
  - chapter_id: ch14
    title: DFS
    learning_goals: [掌握深度优先搜索和递归关系]
    knowledge_points: [DFS, 递归, 回溯, 连通分量]
    prerequisites: [ch07, ch12]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [DFS 访问序, 连通性]
  - chapter_id: ch15
    title: 最短路径
    learning_goals: [掌握 Dijkstra 和 Floyd 的适用条件]
    knowledge_points: [最短路径, Dijkstra, Floyd, Bellman-Ford]
    prerequisites: [ch12, ch13, ch14]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [松弛操作, 路径恢复]
  - chapter_id: ch16
    title: 并查集
    learning_goals: [掌握集合合并与查找, 理解路径压缩]
    knowledge_points: [并查集, 路径压缩, 按秩合并, 连通性]
    prerequisites: [ch08, ch12]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [union-find 操作, 连通分量]
  - chapter_id: ch17
    title: 排序
    learning_goals: [比较常见排序算法, 理解稳定性和复杂度]
    knowledge_points: [插入排序, 选择排序, 冒泡排序, 快速排序, 归并排序, 堆排序, 排序稳定性]
    prerequisites: [ch02, ch10]
    resource_types: [doc, code_case, quiz]
    expected_exercises: [排序过程, 算法选择]
  - chapter_id: ch18
    title: 查找
    learning_goals: [掌握顺序查找、折半查找和树表查找]
    knowledge_points: [顺序查找, 折半查找, 二叉排序树, AVL树, B树, B+树]
    prerequisites: [ch02, ch09, ch11]
    resource_types: [doc, card, quiz]
    expected_exercises: [查找判定树, 平均查找长度]
  - chapter_id: ch19
    title: 综合项目
    learning_goals: [综合应用结构选择、复杂度分析和代码实现]
    knowledge_points: [LRU缓存, 倒排索引, 课程知识图谱, 图搜索应用]
    prerequisites: [ch03, ch09, ch11, ch12, ch17, ch18]
    resource_types: [project, code_case, quiz]
    expected_exercises: [小项目设计, 复杂度报告]
